name: WeeklyReport

on:
  schedule: 
    - cron: '0 12 * * 5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Run email code
        env: 
          USER_EMAIL: ${{ secrets.CHANEY_EMAIL}}
          USER_PASSWORD: ${{ secrets.CHANEY_PASSWORD}}
        run: python send_email.py